[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build_meta"

[project]
name = "pytest-llm-validate"
description = "A pytest plugin for AI-driven qualitative & behavioural tests"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [
    {name = "pytest-llm-validate contributors"},
]
keywords = ["pytest", "llm", "ai", "testing", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic-ai-slim[openai]>=0.0.14",
    "pytest>=8.0.0",
    "click>=8.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
]
version = "0.1.0-rc1"

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.8.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "pre-commit>=3.6.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocs-section-index>=0.3.0",
    "semantic-release>=8.5.0",
]
logfire = [
    "pydantic-ai[logfire]",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/numerous-com/pytest-llm-validate"
Documentation = "https://pytest-llm-validate.readthedocs.io/"
Repository = "https://github.com/numerous-com/pytest-llm-validate"
Issues = "https://github.com/numerous-com/pytest-llm-validate/issues"
Changelog = "https://github.com/numerous-com/pytest-llm-validate/releases"

[project.scripts]
pytest-llm-mcp = "numerous.pytest_llm_validate.cli:main"

[project.entry-points.pytest11]
llm_validate = "numerous.pytest_llm_validate.plugin"

[tool.hatch.build.targets.wheel]
packages = ["numerous"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["S101", "D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
implicit_reexport = false
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=numerous.pytest_llm_validate",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "integration: marks tests as integration tests",
    "llm: marks tests that require LLM API calls",
    "slow: marks tests as slow",
]

[tool.coverage.run]
source = ["numerous.pytest_llm_validate"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "pip install build && python -m build"
