name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "test/**"
      - "chore/**"
  pull_request:
    branches:
      - main

jobs:
  build_and_test: # Renamed job for clarity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install project with test and dev dependencies for linting and testing
        pip install -e .[test,dev]

    - name: Lint with Ruff (Format Check)
      run: |
        ruff format --check .

    - name: Lint with Ruff (Linter Check)
      run: |
        ruff check .
        # Consider adding --output-format=github to ruff check for inline annotations

    - name: Test with Pytest
      run: |
        pytest tests/
        # Future: Add coverage --cov=numerous --cov-report=xml

    # Placeholder for docs build - MkDocs will be added in a later phase
