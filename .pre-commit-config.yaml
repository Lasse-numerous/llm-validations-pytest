# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0 # Using a recent version
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-toml
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version should be managed in pyproject.toml or match it
    # For simplicity here, using a recent rev.
    # Ideally, sync this with the version in pyproject.toml's [project.optional-dependencies.dev]
    rev: v0.4.4 # Using a recent version of ruff pre-commit hook
    hooks:
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix]
    -   id: ruff-format
        args: [] # Use default ruff format configuration

ci:
    autofix_commit_msg: |
        chore: auto fixes from pre-commit.com hooks

        for more information, see https://pre-commit.ci
    autoupdate_commit_msg: |
        chore: pre-commit autoupdate
    autoupdate_schedule: weekly
