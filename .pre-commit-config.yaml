repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --scopes=core,test,docs,ci,build,feat,fix,perf,style,refactor,chore,config,scripts,api,cli,web,data,security,deps]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.5
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: sh
        language: system
        types: [python]
        args: [-c, "pytest --tb=short -q --no-cov --override-ini='addopts=' tests/; rm -f .pytest-llm-validate-history.json .coverage"]
        pass_filenames: false
        always_run: true

      - id: mkdocs-build
        name: mkdocs-build
        entry: mkdocs
        language: system
        args: [build, --strict]
        files: ^(docs/.*|mkdocs\.yml)$
        pass_filenames: false

      - id: ci-simulation
        name: ci-simulation
        entry: ./scripts/precommit-ci.sh
        language: system
        args: [all]
        stages: [pre-push]
        pass_filenames: false
        verbose: true
